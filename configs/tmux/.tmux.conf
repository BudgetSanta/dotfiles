# Configuration for tmux

# Config
bind r source-file ~/.tmux.conf               # Reload on C-b r

bind | split-window -h                        # Horizontal pane split using |
bind - split-window -v                        # Vertical pane split using -
unbind '"'                                    # Unbind default Horizontal split
unbind %                                      # Unbind default Vertical split

bind -n S-Left  previous-window               # Shift-left go to tab left
bind -n S-Right next-window                   # Shift-right go to tab right

set-option -g mouse on                        # Mouse Support
set -g @scroll-speed-num-lines-per-scroll "1"

set -g focus-events on                        # Claude Focus Events

set -g extended-keys always                   # Pass Shift+Enter (and other extended keys) through to apps like Claude Code
set -as terminal-features 'xterm*:extkeys'    # Extended key support for apps running in tmux


# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin "arcticicestudio/nord-tmux"
set -g @plugin 'tmux-plugins/tmux-sensible'


# Initilise Plugins
run '~/.tmux/plugins/tpm/tpm'
